# Rule schema definition — every rule YAML file must conform to this.
# CI validates all rules/*.yaml against this schema on every change.
required_fields:
  - id          # unique identifier, e.g. PI-001, ENC-003
  - name        # short human-readable name
  - description # what the rule detects
  - category    # attack category (prompt_injection, jailbreak, role_hijack, etc.)
  - severity    # integer 1-4 (1=low, 2=medium, 3=high, 4=critical)
  - pattern     # regex pattern (Python re syntax)
  - enabled     # boolean

optional_fields:
  - tags         # list of tags (e.g. owasp-llm01)
  - case_sensitive  # boolean, default false

valid_categories:
  - prompt_injection
  - jailbreak
  - role_hijack
  - data_exfiltration
  - system_prompt_leak
  - encoding_attack
  - context_injection
  - denial_of_service
  - multi_turn_manipulation

severity_levels:
  1: low
  2: medium
  3: high
  4: critical
