[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "prompt-injection-firewall"
version = "0.1.0"
description = "Request-level security layer for LLM prompt injection detection and prevention"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Team CipherGuard"},
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "onnxruntime>=1.16.0",
    "pydantic>=2.5.0",
    "structlog>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
]
ml = [
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
    "scikit-learn>=1.3.0",
    "optimum[onnxruntime]>=1.13.0",
]

[project.scripts]
pif = "service.main:cli_entry"
pif-scan = "classifier.inference:cli_scan"

[tool.setuptools.packages.find]
include = ["rules*", "classifier*", "adjudicator*", "policy*", "service*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
